<!DOCTYPE html>
<html>
<head>
    <title>Java Full Stack Task 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <h1>Welcome to My Landing Page</h1>
    <p>Java Full Stack Internship Task 1</p>
</section>

<section class="contact">
    <h2>Contact Us</h2>

    <form action="/submit" method="post">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <textarea name="message"
                  placeholder="Enter Message"
                  required></textarea>

        <button type="submit">
            Submit
        </button>

    </form>
</section>

</body>
</html>
