
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connectly - Contact Us</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">&#9993;</span>
            <span>Connectly</span>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="main-container">

        <section class="hero">
            <h1>Let's Connect</h1>
            <p>Have a question or an idea? We'd love to hear from you.</p>
            <p>Send us a message using the form below.</p>
        </section>

        <!-- Contact Form -->
        <section class="contact-card" id="contact">

            <h2>Get in Touch</h2>

            <form action="/contact" method="post">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message here"
                        rows="5"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Connectly. All rights reserved.</p>
    </footer>

</body>
</html>
